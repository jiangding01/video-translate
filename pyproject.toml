[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xvt-video-translate"
version = "0.2.0"
description = "Local-first video transcription, subtitle translation, and burn-in CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pysubs2>=1.8.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "ruff>=0.12",
]
asr-mlx = [
    "mlx-whisper>=0.4.3",
]

[project.scripts]
xvt = "xvt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
