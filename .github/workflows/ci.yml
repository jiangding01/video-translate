name: CI

on:
  push:
    branches: [main, codex/ci-cjk-fonts]  # TEMP: 无 PR 时也能跑真实 CI，取证后回退
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # 字幕字体不是可选装饰：`render.font_for_language` 在非 darwin / 非 win32 上给
      # zh / ja / ko 要 Noto Sans CJK SC / JP / KR，给其余语言要 DejaVu Sans。缺字体时
      # libass 报 "failed to find any fallback with glyph" → `measure_bilingual_line_widths`
      # 抛 ValueError → `qa.check_subtitles` **静默降级**到保守显示单位上限（只记一条
      # layout_measurement_unavailable warning），于是行宽 QA 从未真正测量过而 CI 照样全绿。
      # 2026-10-20 之前的 Linux 侧就是这个状态。
      #
      # fonts-noto-cjk 一个包提供 SC / JP / KR / TC 四个家族；fonts-dejavu-core 提供非 CJK
      # 回退（runner 镜像一般自带，显式写出来是为了不依赖镜像内容）；fontconfig 提供 fc-match，
      # 只用于下一步的诊断输出。
      - name: Install subtitle fonts (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core fontconfig
          sudo fc-cache -f

      # 纯观测，不做断言：把 fontconfig 实际解析到的家族打进日志，这样「某个家族名解析
      # 不到」将来能一眼看出来。真正的能力断言在 Sync dependencies 之后那一步。
      - name: Report resolved subtitle fonts (diagnostic, Linux)
        if: runner.os == 'Linux'
        run: |
          for family in "Noto Sans CJK SC" "Noto Sans CJK JP" "Noto Sans CJK KR" "DejaVu Sans"; do
            printf '%s -> ' "$family"
            fc-match "$family"
            printf '%s:bold -> ' "$family"
            fc-match "$family:bold"
          done

      # macOS 侧不装字体：系统自带 Hiragino Sans GB / Hiragino Sans（`font_for_language`
      # 在 darwin 上要的就是这两个）与 Helvetica，实测测量成立。真不成立时下面那步能力
      # 断言会直接红，不需要靠这里的假设。
      #
      # macOS 是本项目的主力开发平台：不装 ffmpeg 时真实烧录与预览的集成测试
      # （tests/test_e2e.py、tests/test_burn.py）会跳过。
      #
      # 必须是 ffmpeg-full：homebrew 把 ffmpeg 拆成了两个 formula，精简的 `ffmpeg`
      # 不带 --enable-libass，而烧录/预览靠 `-vf ass=filename=...` 送字幕，缺 libass
      # 会直接报 "No such filter: 'ass'"。探测滤镜而不是探测可执行文件：精简版装着
      # 也得换掉。
      - name: Install ffmpeg with libass (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          if ffmpeg -hide_banner -filters 2>/dev/null | awk '{print $2}' | grep -qx ass; then
            echo "ffmpeg already provides the ass filter"
          else
            brew install --quiet ffmpeg-full
          fi

      # 装完立刻断言能力到位。少了这一步，哪天 formula 又变精简，集成测试会退回
      # 静默跳过，而 CI 照样全绿——那正是本轮要修掉的状态。
      - name: Verify ffmpeg provides the ass filter
        run: ffmpeg -hide_banner -filters | awk '{print $2}' | grep -qx ass

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev

      # 与上面的 ass 滤镜断言同形、同理由：断言**真实能力**，不断言代理指标。
      # `fc-list | grep -i cjk` 只能证明「字体包在盘上」，证明不了「fontconfig 解析得到
      # `font_for_language` 要的家族」更证明不了「libass 量得出包围盒」，所以这一步真的调
      # 一次 `render.measure_bilingual_line_widths` + `qa.check_subtitles`，并断言报告自己的
      # layout["measurement"] == "measured"。抛错即失败，降级也失败。
      #
      # **顺序约束：必须排在 `Sync dependencies` 之后**（脚本 import xvt，依赖已安装的包），
      # 不能像 ffmpeg 那两步一样提到最前。挪动步骤请保持这个相对顺序。
      - name: Verify libass can measure subtitle line widths (must stay after Sync dependencies)
        run: uv run --no-sync python .github/scripts/verify_layout_measurement.py

      - name: Lint (ruff check)
        run: uv run --no-sync ruff check src tests

      - name: Format check (ruff format)
        run: uv run --no-sync ruff format --check src tests

      # -rs 让 skip 原因出现在日志摘要里：否则「集成测试被静默跳过」在 CI 上不可见。
      - name: Test (pytest)
        run: uv run --no-sync pytest -q -rs

      # TEMP（取证用，取证后回退）：-s 让那条 E2E 测试把 measurement 与各计数打进日志，
      # 用来逐字证明 Linux 上真的走了 measured 那一路、复用分支真的执行了。
      - name: Observe burn reuse decision (TEMP)
        run: uv run --no-sync pytest -q -s tests/test_e2e.py::EndToEndTest::test_workflow_burn_reuses_the_rendered_layout_qa_and_ass

      - name: CLI smoke test
        run: uv run --no-sync xvt --help

      - name: Build package (uv build)
        run: uv build
